<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SaveWise Data Migration</title>
</head>
<body>
  <script>
    var sent = false;
    function sendData() {
      if (sent) return;
      try {
        var data = {};
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          data[k] = localStorage.getItem(k);
        }
        if (window.LegacyMigrationBridge && typeof window.LegacyMigrationBridge.onLegacyData === 'function') {
          sent = true;
          window.LegacyMigrationBridge.onLegacyData(JSON.stringify(data));
        }
      } catch (err) {
        if (window.LegacyMigrationBridge && typeof window.LegacyMigrationBridge.onLegacyData === 'function') {
          sent = true;
          window.LegacyMigrationBridge.onLegacyData("{}");
        }
      }
    }
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(sendData, 50);
    });
    window.onload = function() {
      setTimeout(sendData, 100);
    };
    setTimeout(sendData, 300);
  </script>
</body>
</html>
